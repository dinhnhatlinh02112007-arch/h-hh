<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chúc các bạn nữ 20/10 💖</title>
<style>
  body{
    background: linear-gradient(180deg,#fff0f6,#ffe6f2);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color:#6a0040;
    margin:0;
    padding:60px 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .card{
    background: #fff;
    border-radius: 20px;
    padding: 36px;
    max-width: 720px;
    width:100%;
    box-shadow: 0 10px 30px rgba(255,105,180,0.12);
    text-align:center;
  }
  h1{color:#ff2e9d;margin:6px 0 12px;font-size:28px;}
  p{color:#6a0040;font-size:20px;line-height:1.6;margin:12px 0;}
  .cute{font-size:56px;line-height:1;margin:6px 0;}
  .flower{margin-top:18px;font-size:28px}
  @media (max-width:480px){h1{font-size:22px}p{font-size:18px}}
</style>
</head>
<body>
  <div class="card">
    <div class="cute">💖🌸</div>
    <h1>Chúc các bạn nữ 20/10!</h1>
    <p>Chúc các bạn nữ 20/10 xinh đẹp, ngọt ngào như hoa nhé các bạn! 💐</p>
    <div class="flower">🌷✨</div>
  </div>
</body>
</html>
