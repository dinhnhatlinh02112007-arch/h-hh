
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mừng 20/10 💖</title>
<style>
  body {
    background-color: #ffe6f2;
    font-family: "Comic Sans MS", cursive, sans-serif;
    color: #ff4da6;
    text-align: center;
    padding: 100px 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
    display: inline-block;
    max-width: 500px;
  }
  h1 {
    font-size: 2em;
    margin-bottom: 20px;
  }
  p {
    font-size: 1.2em;
    line-height: 1.6em;
  }
  .heart {
    font-size: 3em;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="heart">💖</div>
    <h1>Chúc mừng 20/10 🌸</h1>
    <p>Chúc bạn Linh 20/10 xinh đẹp như hoa,<br>
    rực rỡ và ngọt ngào như kẹo nhé 💕<br>
    Cảm ơn bạn đã có mặt trong kỷ niệm của mình 💐</p>
    <div class="heart">💖</div>
  </div>
</body>
</html>
